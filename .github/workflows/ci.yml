name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Gradle check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches the local build environment (java -version reports Temurin 23).
      - name: Set up JDK 23 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      # Provides cmdline-tools/platform-tools and sets ANDROID_HOME /
      # ANDROID_SDK_ROOT. compileSdk/minSdk/targetSdk are all API 36 (with
      # minorApiLevel = 1), which this runner's preinstalled SDK likely does
      # not have, so licenses must be accepted up front and the exact
      # platform/build-tools package is left to AGP's SDK auto-download
      # during the Gradle run below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # `yes |` can make sdkmanager exit non-zero once it stops reading
      # stdin after the last prompt; that's not a real failure here.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs unit tests, lint, and this repo's release-artifact/manifest/
      # runtime-classpath verification tasks (wired into the `check`
      # lifecycle task by app/build.gradle.kts). Never pass --write-locks or
      # --write-verification-metadata here: dependencyLocking is STRICT and
      # gradle/verification-metadata.xml pins checksums, so CI must fail on
      # drift instead of silently rewriting them.
      - name: Run ./gradlew check
        run: ./gradlew check
